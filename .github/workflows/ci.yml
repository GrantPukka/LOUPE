name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "22"

jobs:
  # Linux and macOS both, because CGO means the DuckDB binding is compiled by
  # the host toolchain rather than shipped prebuilt: a change can pass on glibc
  # and fail on the macOS linker.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l $(find . -name '*.go' -not -path './web/*'))
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -race

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # v8+ is required: the action's v7 release dropped golangci-lint v1 and
      # v2 config files are not readable by anything earlier. Pinned to the
      # exact linter version so a new release cannot turn the build red on a
      # commit that did not touch Go.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.2

  # The browser tests drive the real binary against a real ingest, so this job
  # builds the frontend, embeds it, and runs the binary it just produced.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build the UI and the binary
        run: make web && make build

      - name: install playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: run the browser tests
        working-directory: web
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
